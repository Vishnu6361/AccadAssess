<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" fill="none">
  <!-- AcadAssess Full Horizontal / Centered Wordmark Logo -->
  <defs>
    <linearGradient id="forestGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="100%" stop-color="#12352B" />
    </linearGradient>
    <linearGradient id="oliveGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7558" />
      <stop offset="100%" stop-color="#2E543B" />
    </linearGradient>
    <linearGradient id="goldGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="pageGradLogo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EFE6" />
    </linearGradient>
  </defs>

  <!-- Scaled Emblem (Centered at Top) -->
  <g transform="translate(70, -10) scale(1)">
    <!-- Left Laurel -->
    <g fill="url(#oliveGradLogo)" stroke="#1B4D3E" stroke-width="0.75" stroke-linejoin="round">
      <path d="M 50 135 C 32 110 30 75 42 42" fill="none" stroke="#2E543B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 46 130 C 36 128 32 120 37 114 C 42 118 45 125 46 130 Z" />
      <path d="M 52 122 C 43 118 40 109 46 104 C 50 109 52 116 52 122 Z" />
      <path d="M 37 108 C 25 104 22 93 29 88 C 34 93 37 101 37 108 Z" />
      <path d="M 43 97 C 32 91 30 80 37 76 C 42 81 43 89 43 97 Z" />
      <path d="M 32 82 C 22 75 22 64 30 60 C 34 66 35 74 32 82 Z" />
      <path d="M 40 70 C 31 63 32 52 40 49 C 43 55 43 63 40 70 Z" />
      <path d="M 33 55 C 27 46 30 36 38 34 C 40 41 39 49 33 55 Z" />
      <path d="M 43 45 C 38 35 44 26 52 26 C 52 33 49 40 43 45 Z" />
    </g>

    <!-- Right Laurel -->
    <g fill="url(#oliveGradLogo)" stroke="#1B4D3E" stroke-width="0.75" stroke-linejoin="round">
      <path d="M 150 135 C 168 110 170 75 158 42" fill="none" stroke="#2E543B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 154 130 C 164 128 168 120 163 114 C 158 118 155 125 154 130 Z" />
      <path d="M 148 122 C 157 118 160 109 154 104 C 150 109 148 116 148 122 Z" />
      <path d="M 163 108 C 175 104 178 93 171 88 C 166 93 163 101 163 108 Z" />
      <path d="M 157 97 C 168 91 170 80 163 76 C 158 81 157 89 157 97 Z" />
      <path d="M 168 82 C 178 75 178 64 170 60 C 166 66 165 74 168 82 Z" />
      <path d="M 160 70 C 169 63 168 52 160 49 C 157 55 157 63 160 70 Z" />
      <path d="M 167 55 C 173 46 170 36 162 34 C 160 41 161 49 167 55 Z" />
      <path d="M 157 45 C 162 35 156 26 148 26 C 148 33 151 40 157 45 Z" />
    </g>

    <!-- Base Ribbon -->
    <path d="M 94 137 C 98 135 102 135 106 137 L 108 144 C 104 142 96 142 92 144 Z" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.75" />
    <circle cx="100" cy="136" r="3" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.75" />

    <!-- Open Book -->
    <path d="M 52 124 C 74 116 96 122 100 126 C 104 122 126 116 148 124 L 146 130 C 124 122 104 127 100 131 C 96 127 76 122 54 130 Z" fill="#12352B" />
    <path d="M 54 121 C 74 114 96 119 99 123 L 99 92 C 96 88 74 83 54 90 Z" fill="#E8E2D5" stroke="#C9C0AF" stroke-width="0.75" />
    <path d="M 56 118 C 75 112 96 117 99 121 L 99 90 C 96 86 75 81 56 88 Z" fill="url(#pageGradLogo)" stroke="#D4CCBC" stroke-width="0.75" />
    <path d="M 146 121 C 126 114 104 119 101 123 L 101 92 C 104 88 126 83 146 90 Z" fill="#E8E2D5" stroke="#C9C0AF" stroke-width="0.75" />
    <path d="M 144 118 C 125 112 104 117 101 121 L 101 90 C 104 86 125 81 144 88 Z" fill="url(#pageGradLogo)" stroke="#D4CCBC" stroke-width="0.75" />
    <path d="M 98 89 L 102 89 L 102 125 L 98 125 Z" fill="#1B4D3E" />
    <line x1="64" y1="96" x2="90" y2="92" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <line x1="64" y1="102" x2="88" y2="98" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <line x1="64" y1="108" x2="85" y2="105" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <line x1="110" y1="92" x2="136" y2="96" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <line x1="112" y1="98" x2="136" y2="102" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <line x1="115" y1="105" x2="136" y2="108" stroke="#2E543B" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />
    <path d="M 99 90 L 101 90 L 102 133 L 100 130 L 98 133 Z" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.5" />

    <!-- Academic Star -->
    <g transform="translate(100, 78) scale(0.9)">
      <polygon points="0,-9 2.7,-2.7 9,0 2.7,2.7 0,9 -2.7,2.7 -9,0 -2.7,-2.7" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Mortarboard Cap -->
    <path d="M 83 45 C 83 40 117 40 117 45 C 117 56 83 56 83 45 Z" fill="#12352B" stroke="#0A1F19" stroke-width="1" />
    <path d="M 85 45 C 85 53 115 53 115 45 L 115 48 C 115 56 85 56 85 48 Z" fill="#1B4D3E" />
    <polygon points="100,16 146,34 100,50 54,34" fill="url(#forestGradLogo)" stroke="#0E2E23" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="100,19 141,34 100,48 59,34" fill="#205845" opacity="0.45" />
    <ellipse cx="100" cy="33.5" rx="3.5" ry="2" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.75" />
    <path d="M 100 34 C 116 35 130 40 134 50 C 137 57 137 66 137 72" fill="none" stroke="url(#goldGradLogo)" stroke-width="2.2" stroke-linecap="round" />
    <rect x="135" y="70" width="4" height="2.5" rx="1" fill="#AA820A" />
    <path d="M 135 72 L 134 85 C 135 86 139 86 140 85 L 139 72 Z" fill="url(#goldGradLogo)" stroke="#AA820A" stroke-width="0.5" />
  </g>

  <!-- Wordmark "AcadAssess" Below Emblem -->
  <text x="170" y="152" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1B4D3E">Acad</tspan><tspan fill="#4A7558">Assess</tspan>
  </text>
</svg>
